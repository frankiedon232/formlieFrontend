# Formalie Platform Admin: production Nginx sketch (domain or IP to decide; always a valid certificate).
# Separate from the portal's Nginx. Never serves *.formalie.com workspace hosts.
# Dedicated servers: as below. AWS: the same, behind the load balancer (or the ALB terminates TLS with ACM). See docs/04-HOSTING.md.

# Optional: only office / VPN networks (also enforced in the API)
geo $platform_allowed {
    default 0;
    # 203.0.113.0/24 1;   # example range, replace with the real ones
}

server {
    listen 443 ssl http2;
    server_name platformadm.formalie.com;

    ssl_certificate     /etc/ssl/platform/fullchain.pem;
    ssl_certificate_key /etc/ssl/platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # if ($platform_allowed = 0) { return 403; }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://platformapi.formalie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Built Nuxt SPA (client-rendered)
    root /srv/platformadm/public;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name platformapi.formalie.com;

    ssl_certificate     /etc/ssl/platform/fullchain.pem;
    ssl_certificate_key /etc/ssl/platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # if ($platform_allowed = 0) { return 403; }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 50m;   # help media uploads go to S3 with pre-signed URLs; keep this small otherwise

    location / {
        proxy_pass http://platform_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

upstream platform_api_upstream {
    server 127.0.0.1:5601;
    # more FastAPI instances here
}
