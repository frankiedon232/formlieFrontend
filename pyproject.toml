[project]
name = "formly-backend"
version = "0.0.0"
description = "Formalie API"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"
markers = [
    "db: needs the PostgreSQL test database (skipped when DB_APP_URL is not set)",
    "parity: runs the same cases as the frontend's tests",
]
